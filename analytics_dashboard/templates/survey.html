{% extends "base.html" %}

{% block title %}User Survey{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Survey" style="max-height: 300px; object-fit: cover;">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">We Value Your Feedback!</h2>
                    {% if thank_you %}
                    <div class="alert alert-success mt-4 text-center" role="alert">
                        <h4 class="alert-heading">Thank you, {{ name }}!</h4>
                        <p>Your feedback has been received.</p>
                        <hr>
                        <p class="mb-0">We appreciate your time and input.</p>
                    </div>
                    {% endif %}
                    <form method="post" action="/survey">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="experience" class="form-label">How was your experience with our dashboard?</label>
                            <select class="form-select" id="experience" name="experience" required>
                                <option value="Excellent">Excellent</option>
                                <option value="Good">Good</option>
                                <option value="Average">Average</option>
                                <option value="Poor">Poor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="comments" class="form-label">Additional Comments</label>
                            <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Survey</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
