<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Analytics Dashboard - Upload and visualize your data"
    />
    <title>{% block title %}Analytics Dashboard{% endblock %}</title>

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link
      href="{{ url_for('static', path='css/style.css') }}"
      rel="stylesheet"
    />

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <!-- Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary"
    >
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="bi bi-graph-up-arrow me-2 text-primary"></i>
          <span class="fw-bold">Analytics Dashboard</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/upload">
                <i class="bi bi-cloud-upload me-1"></i> Upload
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/export.csv" id="exportBtn">
                <i class="bi bi-download me-1"></i> Export CSV
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Toast Container -->
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toastContainer"
    ></div>

    <!-- Main Content -->
    <main class="container py-4">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-dark border-top border-secondary">
      <div class="container text-center text-muted">
        <small
          >&copy; 2024 Analytics Dashboard. Built with FastAPI & Chart.js</small
        >
      </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Toast Helper -->
    <script>
      function showToast(message, type = "success") {
        const toastContainer = document.getElementById("toastContainer");
        const toastId = "toast-" + Date.now();
        const bgClass = type === "error" ? "bg-danger" : "bg-success";
        const iconClass =
          type === "error" ? "bi-exclamation-circle" : "bi-check-circle";

        const toastHTML = `
                <div id="${toastId}" class="toast ${bgClass} text-white" role="alert">
                    <div class="toast-header ${bgClass} text-white">
                        <i class="bi ${iconClass} me-2"></i>
                        <strong class="me-auto">${
                          type === "error" ? "Error" : "Success"
                        }</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">${message}</div>
                </div>
            `;

        toastContainer.insertAdjacentHTML("beforeend", toastHTML);
        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement);
        toast.show();

        toastElement.addEventListener("hidden.bs.toast", () =>
          toastElement.remove()
        );
      }
    </script>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
