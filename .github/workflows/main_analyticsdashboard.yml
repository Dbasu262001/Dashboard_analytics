# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - AnalyticsDashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # use a supported version

      # 🛠️ Local Build Section (Optional)
      - name: Create virtual environment and install dependencies
        run: |
          cd analytics_dashboard
          python -m venv antenv
          ./antenv/bin/pip install -r requirements.txt

      # Upload artifact for deployment jobs (exclude the virtual environment)
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            analytics_dashboard
            !analytics_dashboard/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for Azure login
      contents: read # required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC236A9B93EC49319DB31733DD9969CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24D56C71B8FA4B46B12A43BF273DC0A1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_955A031BE78F49B9B7CD2288450DCFEB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "AnalyticsDash" # match your Azure App Service name
          slot-name: "Production"
          startup-command: "./startup.sh"
          # Ensure the startup script is executable
          # (chmod is handled in the build step if needed)
